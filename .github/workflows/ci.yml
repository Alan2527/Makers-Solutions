name: Suite de pruebas QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Ejecutar suite y generar reporte
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # continue-on-error es intencional: el caso API-02 falla por un defecto
      # real de la API bajo prueba (ver docs/03-hallazgos-api.md). El reporte
      # tiene que publicarse igual para que ese fallo quede visible y trazado.
      - name: Ejecutar pruebas (Cypress)
        id: cypress
        continue-on-error: true
        run: npx cypress run --browser electron

      - name: Generar reporte Allure
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Armar el sitio (dashboard + reporte Allure)
        if: always()
        run: |
          mkdir -p sitio
          cp -r dashboard/* sitio/
          cp -r allure-report sitio/allure

      - name: Subir evidencia de la ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-cypress
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Preparar publicacion en GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    name: Publicar dashboard y reporte
    needs: pruebas
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
